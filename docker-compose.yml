
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite-data:/data
      - static-data:/code/staticfiles
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), timeout=2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite-data:/data
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite-data:/data
      - celerybeat-data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  redis-data:
  sqlite-data:
  static-data:
  celerybeat-data:
